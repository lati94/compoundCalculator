services:
  # Backend Service
  - type: web
    name: compound-calculator-backend
    env: docker
    dockerContext: ./backend
    plan: free
    region: frankfurt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 80
    envVars:
      - key: PORT
        value: 80

  # Frontend Service
  - type: web
    name: compound-calculator-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile.prod
    plan: free
    region: frankfurt
    # We need to link the backend URL here. 
    # Render Blueprints don't easily allow dynamic public URLs as build args for other services in the same deploy.
    # User will need to hardcode this or update it after first deploy.
    envVars:
      - key: VITE_API_URL
        value: https://compound-calculator-backend.onrender.com # Placeholder: UPDATE THIS in Dashboard
